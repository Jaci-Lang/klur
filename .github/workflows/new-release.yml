name: new-release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Release version tag (e.g. 0.1.0 or v0.1.0)"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false
      build_macos_x86_64:
        type: boolean
        description: "Build macOS x86_64 (Intel)"
        default: true

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(
          github.event_name != 'workflow_dispatch' || inputs.build_macos_x86_64
          &&
          '[{"name":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"},{"name":"x86_64-apple-darwin","runner":"macos-13"},{"name":"aarch64-apple-darwin","runner":"macos-14"},{"name":"x86_64-pc-windows-msvc","runner":"windows-latest"}]'
          ||
          '[{"name":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"},{"name":"aarch64-apple-darwin","runner":"macos-14"},{"name":"x86_64-pc-windows-msvc","runner":"windows-latest"}]'
          ) }}

    name: build-${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Jaci Engine Bootstrap (Ubuntu)
        if: matrix.os.name == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o luau-ubuntu.zip \
            https://github.com/Jaci-Lang/jaci/releases/latest/download/luau-ubuntu.zip \
            || curl -fsSL \
            -o luau-ubuntu.zip \
            https://github.com/Jaci-Lang/jaci/releases/latest/download/luau-linux-x64.zip

          rm -rf /tmp/jaci
          mkdir -p /tmp/jaci

          unzip -o -q luau-ubuntu.zip -d /tmp/jaci

          chmod +x /tmp/jaci/*

          sudo cp /tmp/jaci/luau /usr/local/bin/luau \
            || sudo cp /tmp/jaci/luau* /usr/local/bin/luau \
            || true

      - name: Download Jaci Engine Bootstrap (macOS)
        if: matrix.os.name == 'x86_64-apple-darwin' || matrix.os.name == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o luau-macos.zip \
            https://github.com/Jaci-Lang/jaci/releases/latest/download/luau-macos.zip

          rm -rf /tmp/jaci
          mkdir -p /tmp/jaci

          unzip -o -q luau-macos.zip -d /tmp/jaci

          chmod +x /tmp/jaci/*

          sudo cp /tmp/jaci/luau /usr/local/bin/luau \
            || cp /tmp/jaci/luau /usr/local/bin/luau \
            || true

      - name: Download Jaci Engine Bootstrap (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            -Uri "https://github.com/Jaci-Lang/jaci/releases/latest/download/luau-windows.zip" `
            -OutFile "luau-windows.zip"

          Expand-Archive `
            -Path "luau-windows.zip" `
            -DestinationPath "C:\jaci" `
            -Force

          "C:\jaci" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: Build Standalone KLUR Binary (Unix)
        if: matrix.os.name != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          ./bin/klur build \
            src/init.luau \
            --output dist/klur

          chmod +x dist/klur

          cd dist

          zip -j -9 \
            "../klur-${{ matrix.os.name }}.zip" \
            klur

      - name: Build Standalone KLUR Binary (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist |
            Out-Null

          .\bin\klur.cmd build `
            src/init.luau `
            --output dist/klur.exe

          7z a `
            -mx=9 `
            "klur-${{ matrix.os.name }}.zip" `
            ".\dist\klur.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klur-${{ matrix.os.name }}
          path: klur-${{ matrix.os.name }}.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: publish-release
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"

            if [[ "$VERSION" != v* ]]; then
              VERSION="v$VERSION"
            fi

            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          elif [[ -n "${{ github.ref_name }}" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

          else
            echo "VERSION=v0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          find artifacts \
            -type f \
            -name "*.zip" \
            -exec cp {} release-assets/ \;

          cd release-assets

          for f in *.zip; do
            sha256sum "$f" |
              awk '{print $1}' \
              > "$f.sha256"
          done

          sha256sum *.zip > SHA256SUMS.txt

          ls -la

      - name: Generate Dynamic Release Notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.ver.outputs.VERSION }}"

          PREV_TAG=$(
            git describe \
              --tags \
              --abbrev=0 \
              --exclude="$VERSION" \
              HEAD^ \
              2>/dev/null \
            || git describe \
              --tags \
              --abbrev=0 \
              --exclude="$VERSION" \
              2>/dev/null \
            || echo ""
          )

          echo "Detected previous tag: $PREV_TAG"

          {
            echo "## What's Changed in KLUR ${VERSION}"
            echo ""

            echo "### Highlights"
            echo "- Standardized runtime batteries for Jaci in 100% pure Luau (\`@klur/*\`)."
            echo "- Fast \`Packagefile\` package manager with relative symlinks and cache store (\`~/.klur/store/\`)."
            echo "- Standalone single-binary compiler via \`klur build\`."
            echo ""

            echo "### Changes & Commits"

            if [[ -n "$PREV_TAG" ]]; then
              CHANGES=$(
                git log \
                  "${PREV_TAG}..HEAD" \
                  --no-merges \
                  --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) by @%an" \
                  2>/dev/null \
                || true
              )

              if [[ -z "$CHANGES" ]]; then
                CHANGES="* No changes detected between ${PREV_TAG} and ${VERSION}."
              fi

              echo "$CHANGES"
              echo ""

              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
            else
              CHANGES=$(
                git log \
                  -n 50 \
                  --no-merges \
                  --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) by @%an" \
                  2>/dev/null \
                || true
              )

              if [[ -z "$CHANGES" ]]; then
                CHANGES="* Initial release."
              fi

              echo "$CHANGES"
            fi

            echo ""
            echo "### Checksums & Cryptographic Verification"
            echo "| File | SHA-256 Checksum |"
            echo "| :--- | :--- |"

            while read -r hash file; do
              echo "| \`$file\` | \`$hash\` |"
            done < release-assets/SHA256SUMS.txt

            echo ""
            echo "### Installation & Quick Start"
            echo "\`\`\`bash"
            echo "# Download and unpack for your OS"
            echo "unzip klur-x86_64-unknown-linux-gnu.zip"
            echo "sudo mv klur /usr/local/bin/"
            echo ""
            echo "# Initialize a new project"
            echo "klur init"
            echo "klur run src/init.luau"
            echo "klur test"
            echo "\`\`\`"
          } > release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.VERSION }}
          name: KLUR ${{ steps.ver.outputs.VERSION }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: release_notes.md
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
