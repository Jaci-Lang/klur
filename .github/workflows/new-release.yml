name: new-release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Release version tag (e.g. 0.1.0 or v0.1.0)"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false

  push:
    tags:
      - "v*"

permissions:
  contents: write

# KLUR is distributed as one platform-neutral source archive. The engine
# (platform-specific) comes from the Jaci releases; jaciup unpacks this
# archive into the toolchain and wraps it with a launcher. `klur build`
# remains available for users to produce single binaries of their own
# applications.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            engine: luau-x86_64-unknown-linux-gnu.zip
          - triple: aarch64-apple-darwin
            runner: macos-14
            # The engine currently ships x86_64 for macOS; Apple Silicon
            # runners run it through Rosetta.
            engine: luau-x86_64-apple-darwin.zip

    name: test-${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Jaci Engine
        shell: bash
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail

          REL="https://pop.squareweb.app/v1/releases/latest?product=jaci"

          DL=$(curl -fsSL "$REL" \
            | jq -r ".assets[] | select(.name==\"$ENGINE\") | .download_url")

          if [[ -z "$DL" || "$DL" == "null" ]]; then
            echo "Could not resolve Jaci engine artifact $ENGINE"
            exit 1
          fi

          curl -fSL -o engine.zip "https://pop.squareweb.app$DL"

          rm -rf /tmp/jaci
          mkdir -p /tmp/jaci
          unzip -o -q engine.zip -d /tmp/jaci
          chmod +x /tmp/jaci/*

      - name: Install Engine
        if: runner.os == 'Linux'
        shell: bash
        run: sudo cp /tmp/jaci/luau /usr/local/bin/luau

      - name: Install Engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo cp /tmp/jaci/luau /usr/local/bin/luau \
            || { cp /tmp/jaci/luau /usr/local/bin/luau 2>/dev/null || cp /tmp/jaci/luau "$HOME/bin/luau"; }
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run KLUR Test Suite
        shell: bash
        run: ./bin/klur test

      - name: Single-Binary Smoke Test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p smoke/src
          cat > smoke/src/init.luau <<'EOF'
local Path = require("@klur/path")
print("smoke:", Path.join("a", "b"))
EOF

          ./bin/klur build smoke/src/init.luau --output smoke/app
          chmod +x smoke/app

          # Run from a different working directory: the binary must be
          # self-contained.
          APP="$(pwd)/smoke/app"
          cd /
          OUT="$("$APP")"
          echo "$OUT"
          [[ "$OUT" == "smoke: a/b" ]] || { echo "smoke test failed"; exit 1; }

  publish-release:
    name: publish-release
    needs:
      - test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"

            if [[ "$VERSION" != v* ]]; then
              VERSION="v$VERSION"
            fi

            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          elif [[ -n "${{ github.ref_name }}" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

          else
            echo "VERSION=v0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Platform-Neutral Archive
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          VERSION_TAG="${{ steps.ver.outputs.VERSION }}"
          VERSION_TAG="${VERSION_TAG#v}"

          mkdir -p release-assets

          STAGE="klur-${VERSION_TAG}"
          mkdir -p "$STAGE/packages/@klur"

          # Source tree: the launcher (generated by jaciup) runs
          # <engine> <toolchain>/src/init.luau.
          cp -r src "$STAGE/src"
          cp -r bin "$STAGE/bin"

          # The standard library as a package, resolvable from the
          # toolchain root by the engine's neutral package pattern
          # (<root>/packages/@klur/<module>).
          cp -r src/std/. "$STAGE/packages/@klur/"

          # Config, manifest and docs.
          cp .luaurc "$STAGE/.luaurc"
          cp Packagefile "$STAGE/Packagefile"
          cp README.md "$STAGE/README.md"
          cp LICENSE "$STAGE/LICENSE"

          (
            cd "$STAGE"
            zip -r -9 "../release-assets/klur-${VERSION_TAG}.zip" .
          )

          cd release-assets
          sha256sum "klur-${VERSION_TAG}.zip" > "klur-${VERSION_TAG}.zip.sha256"
          cp "klur-${VERSION_TAG}.zip.sha256" SHA256SUMS.txt

          ls -la

      - name: Generate Dynamic Release Notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.ver.outputs.VERSION }}"
          VERSION_TAG="${VERSION#v}"

          PREV_TAG=$(
            git describe \
              --tags \
              --abbrev=0 \
              --exclude="$VERSION" \
              HEAD^ \
              2>/dev/null \
            || git describe \
              --tags \
              --abbrev=0 \
              --exclude="$VERSION" \
              2>/dev/null \
            || echo ""
          )

          echo "Detected previous tag: $PREV_TAG"

          {
            echo "## What's Changed in KLUR ${VERSION}"
            echo ""

            echo "### Highlights"
            echo '- Standardized runtime batteries for Jaci in 100% pure Luau (`@klur/*`).'
            echo '- Fast `Packagefile` package manager with relative symlinks and cache store (`~/.klur/store/`).'
            echo '- Single-binary compiler for applications via `klur build`.'
            echo '- One platform-neutral archive: install with `jaciup toolchain install`.'
            echo ""

            echo "### Changes & Commits"

            if [[ -n "$PREV_TAG" ]]; then
              CHANGES=$(
                git log \
                  "${PREV_TAG}..HEAD" \
                  --no-merges \
                  --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) by @%an" \
                  2>/dev/null \
                || true
              )

              if [[ -z "$CHANGES" ]]; then
                CHANGES="* No changes detected between ${PREV_TAG} and ${VERSION}."
              fi

              echo "$CHANGES"
              echo ""

              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
            else
              CHANGES=$(
                git log \
                  -n 50 \
                  --no-merges \
                  --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) by @%an" \
                  2>/dev/null \
                || true
              )

              if [[ -z "$CHANGES" ]]; then
                CHANGES="* Initial release."
              fi

              echo "$CHANGES"
            fi

            echo ""
            echo "### Checksums & Cryptographic Verification"
            echo "| File | SHA-256 Checksum |"
            echo "| :--- | :--- |"

            while read -r hash file; do
              echo "| \`$file\` | \`$hash\` |"
            done < release-assets/SHA256SUMS.txt

            echo ""
            echo "### Installation & Quick Start"
            echo '```bash'
            echo "# With jaciup (recommended): installs engine + KLUR"
            echo "jaciup toolchain install latest"
            echo ""
            echo "# Manually: unpack the archive next to a Jaci engine"
            echo "unzip klur-${VERSION_TAG}.zip -d ~/.jaciup/toolchains/mytoolchain"
            echo '```'
          } > release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.VERSION }}
          name: KLUR ${{ steps.ver.outputs.VERSION }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: release_notes.md
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
