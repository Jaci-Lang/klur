name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Pre-compiled Jaci / Luau Engine (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          REL="https://pop.squareweb.app/v1/releases/latest?product=jaci"
          DL=$(curl -fsSL "$REL" | jq -r '.assets[] | select(.name=="luau-x86_64-unknown-linux-gnu.zip") | .download_url')
          if [[ -z "$DL" || "$DL" == "null" ]]; then
            echo "Could not resolve Jaci artifact URL for x86_64-unknown-linux-gnu"
            exit 1
          fi
          curl -fSL -o luau-ubuntu.zip "https://pop.squareweb.app$DL"
          unzip -o -q luau-ubuntu.zip -d /tmp/jaci
          chmod +x /tmp/jaci/*
          sudo cp /tmp/jaci/luau /usr/local/bin/luau || sudo cp /tmp/jaci/luau* /usr/local/bin/luau || true

      - name: Download Pre-compiled Jaci / Luau Engine (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          REL="https://pop.squareweb.app/v1/releases/latest?product=jaci"
          DL=$(curl -fsSL "$REL" | jq -r '.assets[] | select(.name=="luau-x86_64-apple-darwin.zip") | .download_url')
          if [[ -z "$DL" || "$DL" == "null" ]]; then
            echo "Could not resolve Jaci artifact URL for x86_64-apple-darwin"
            exit 1
          fi
          curl -fSL -o luau-macos.zip "https://pop.squareweb.app$DL"
          unzip -o -q luau-macos.zip -d /tmp/jaci
          chmod +x /tmp/jaci/*
          sudo cp /tmp/jaci/luau /usr/local/bin/luau || cp /tmp/jaci/luau /usr/local/bin/luau || true

      - name: Download Pre-compiled Jaci / Luau Engine (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $json = Invoke-RestMethod -Uri "https://pop.squareweb.app/v1/releases/latest?product=jaci"
          $asset = $json.assets | Where-Object { $_.name -eq "luau-x86_64-pc-windows-msvc.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not resolve Jaci artifact URL for x86_64-pc-windows-msvc"
          }
          $url = "https://pop.squareweb.app" + $asset.download_url
          Invoke-WebRequest -Uri $url -OutFile luau-windows.zip
          Expand-Archive -Path luau-windows.zip -DestinationPath C:\jaci -Force
          echo "C:\jaci" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run KLUR Test Suite
        shell: bash
        run: |
          chmod +x bin/klur
          ./bin/klur test
